<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F3" />
    <title>CB Cakes &amp; Events | Custom Cakes &amp; Events in Mombasa</title>
    <meta
      name="description"
      content="CB Cakes & Events creates custom cakes, wedding cakes and beautiful dessert experiences for celebrations in Mombasa, Kenya."
    />
    <meta property="og:title" content="CB Cakes & Events | Custom Cakes & Events in Mombasa" />
    <meta
      property="og:description"
      content="CB Cakes & Events creates custom cakes, wedding cakes and beautiful dessert experiences for celebrations in Mombasa, Kenya."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/cakes/wedding-burgundy.jpg" />
    <meta property="og:locale" content="en_KE" />
    <link rel="icon" type="image/png" href="/images/logo/cb-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Bakery",
        "name": "CB Cakes & Events",
        "image": "/images/logo/cb-logo.png",
        "email": "Cherrybakers9@gmail.com",
        "telephone": "+254729395751",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mombasa",
          "addressCountry": "KE"
        },
        "areaServed": "Mombasa",
        "sameAs": ["https://www.instagram.com/cherry_bakers_mombasa/"]
      }
    </script>
  </head>
  <body>
    <form name="inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="event-date" />
      <input type="text" name="event-type" />
      <input type="text" name="event-location" />
      <input type="text" name="guests" />
      <textarea name="looking-for"></textarea>
      <textarea name="details"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
